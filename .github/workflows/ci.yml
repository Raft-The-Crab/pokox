name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows ${{ matrix.toolchain }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, mingw]
    steps:
      - name: Preserve Unix line endings
        run: git config --global core.autocrlf input

      - name: Check out PokoX
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0 # Include tags so exact-HEAD version detection works.
          persist-credentials: false

      - name: Set up Python for golden tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up MSYS2 MinGW64
        if: matrix.toolchain == 'mingw'
        id: msys2
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2.30.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Add MinGW tools to PATH
        if: matrix.toolchain == 'mingw'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          if (-not (Test-Path "$mingwBin\g++.exe")) { throw 'MinGW C++ compiler not found' }
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check out pinned vcpkg
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: microsoft/vcpkg
          ref: 4b089e9116ef2715919c32dd6ca3ab98bc341eb8
          path: _vcpkg
          persist-credentials: false

      - name: Bootstrap vcpkg
        run: '& "$env:GITHUB_WORKSPACE/_vcpkg/bootstrap-vcpkg.bat" -disableMetrics'

      - name: Configure MSVC
        if: matrix.toolchain == 'msvc'
        run: >-
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/_vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DPOKO_WITH_DEPENDENCIES=ON -DPOKO_WITH_SDL_PLATFORM=ON -DBUILD_TESTING=ON
          -DPOKO_IMGUI=OFF -DPOKO_DEBUG=OFF -DPOKO_D3D12=OFF

      - name: Configure MSYS2 MinGW
        if: matrix.toolchain == 'mingw'
        run: >-
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/_vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic
          -DVCPKG_HOST_TRIPLET=x64-mingw-dynamic
          -DMINGW_BUILD=TRUE
          -DPOKO_WITH_DEPENDENCIES=ON -DPOKO_WITH_SDL_PLATFORM=ON -DBUILD_TESTING=ON
          -DPOKO_IMGUI=OFF -DPOKO_DEBUG=OFF -DPOKO_D3D12=OFF

      - name: Build
        run: cmake --build build-ci --config Debug --parallel 2

      - name: Run tests
        run: ctest --test-dir build-ci -C Debug --output-on-failure --no-tests=error

  # The dependency-free MSVC leg keeps _ITERATOR_DEBUG_LEVEL=0 coverage: the
  # allocation-injection tests cannot run when prebuilt vcpkg C++ binaries
  # (Catch2/imgui/spdlog) force the default debug iterator level.
  windows-msvc-nodeps:
    name: Windows MSVC (dependency-free)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve Unix line endings
        run: git config --global core.autocrlf input

      - name: Check out PokoX
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for golden tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Configure MSVC without dependencies
        run: >-
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DPOKO_IMGUI=OFF -DPOKO_DEBUG=OFF -DPOKO_D3D12=OFF

      - name: Build
        run: cmake --build build-ci --config Debug --parallel 2

      - name: Run tests
        run: ctest --test-dir build-ci -C Debug --output-on-failure --no-tests=error

  linux-build:
    name: Linux GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out PokoX
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for golden tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build and Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf autoconf-archive automake libtool libltdl-dev autopoint gettext \
            libglvnd-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            wayland-protocols libwayland-dev libdecor-0-dev \
            libvulkan-dev glslang-tools xvfb xauth mesa-vulkan-drivers vulkan-validationlayers

      - name: Install pinned console test dependencies
        run: python -m pip install "python-xlib==0.33" "Pillow==11.3.0"

      - name: Check out pinned vcpkg
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: microsoft/vcpkg
          ref: 4b089e9116ef2715919c32dd6ca3ab98bc341eb8
          path: _vcpkg
          persist-credentials: false

      - name: Bootstrap vcpkg
        run: ./_vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/_vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DPOKO_WITH_DEPENDENCIES=ON -DPOKO_WITH_SDL_PLATFORM=ON -DBUILD_TESTING=ON
          -DPOKO_WITH_VULKAN_DEMO=ON -DPOKO_WITH_SHADER_ARTIFACTS=ON -DPOKO_WITH_IMGUI_DEMO=ON
          -DPOKO_MUTE_EXHAUSTIVE_TESTS=ON -DPOKO_MUTE_X11_INTERACTION_TESTS=ON
          -DPOKO_IMGUI=ON -DPOKO_DEBUG=ON -DPOKO_D3D12=OFF

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Run tests under Xvfb (real X11 display for visual tests)
        run: xvfb-run -a ctest --test-dir build-ci --output-on-failure --no-tests=error

  linux-lit-cube-golden:
    name: Linux Vulkan lit-cube golden (software)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    env:
      SDL_VIDEODRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NATIVE_VECTOR_WIDTH: '128'
      LP_NUM_THREADS: '1'
    steps:
      - name: Check out PokoX
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install build and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-11 cmake pkg-config libx11-dev libxext-dev \
            libxrandr-dev libxfixes-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxss-dev libxkbcommon-dev xvfb xauth

      - name: Set up pinned software graphics environment
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          micromamba-version: '2.0.5-0'
          environment-name: poko-graphics
          environment-file: tools/dependencies/linux-graphics-conda-explicit.txt
          cache-environment: false

      - name: Configure environment
        run: |
          echo "CMAKE_PREFIX_PATH=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$CONDA_PREFIX/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          echo "LIBGL_DRIVERS_PATH=$CONDA_PREFIX/lib/dri" >> "$GITHUB_ENV"
          install -d -m 700 "$RUNNER_TEMP/poko-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/poko-runtime" >> "$GITHUB_ENV"

      - name: Configure golden build
        run: >-
          cmake -S . -B build-golden -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-11 -DBUILD_TESTING=ON
          -DPOKO_WITH_SDL_PLATFORM=ON -DPOKO_WITH_VULKAN_DEMO=ON
          -DPOKO_WITH_SHADER_ARTIFACTS=ON -DPOKO_WITH_CUBE_DEMO=ON
          -DPOKO_WITH_CUBE_GOLDEN=ON -DDILIGENT_NO_OPENGL=ON

      - name: Build cube and shaders
        run: cmake --build build-golden --target pokox_cube --parallel 2

      - name: Compare the rendered lit cube to the reference
        run: >-
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp'
          ctest --test-dir build-golden -R '^pokox_cube_golden$'
          --output-on-failure --no-tests=error

      - name: Upload actual screenshot on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lit-cube-golden-actual
          path: build-golden/lit_cube_actual.png
          if-no-files-found: ignore
          retention-days: 7
